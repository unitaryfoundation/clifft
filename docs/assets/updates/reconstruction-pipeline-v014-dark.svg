<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 212" width="820" height="212" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">How Clifft global sampling reconstruction rewrites a circuit</title>
  <desc id="pipe-desc">Four-stage pipeline: 1 Original circuit in fixed gate order, 2 Fold Cliffords and tails into a stabilizer tableau frame over |0...0>, 3 Drop dead faults, fixed |0> axes, commuting checks, and merge equivalent noise channels while preserving exact output distributions, 4 Reschedule surviving operations measurement-first into a narrower HIR sampling plan.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <text x="16" y="22" font-size="14.5" font-weight="700" fill="#edf2fa">How global sampling reconstruction shrinks a circuit</text>
  <text x="16" y="38" font-size="11.5" fill="#9fb0c8">Native stabilizer-tableau reduction inspired by Tsim’s closed-output ZX workflow</text>

  <rect x="16.5" y="48.5" width="182" height="152" rx="9" fill="#232834" stroke="#35445c" stroke-opacity="1"/>
  <circle cx="38" cy="71" r="10" fill="#3a2c22"/>
  <text x="38" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#ffb26c">1</text>
  <text x="54" y="75" font-size="12.5" font-weight="700" fill="#edf2fa">Original circuit</text>
  <text x="30" y="106" font-size="11" fill="#9fb0c8">Interleaved Cliffords,</text><text x="30" y="122" font-size="11" fill="#9fb0c8">rotations, noise, resets,</text><text x="30" y="138" font-size="11" fill="#9fb0c8">and trailing Clifford rounds</text><text x="30" y="154" font-size="11" fill="#9fb0c8">in original time order.</text>
  <rect x="28" y="170" width="158" height="20" rx="5" fill="#3a2c22"/>
  <text x="107.0" y="183.5" text-anchor="middle" font-size="10.2" font-weight="600" fill="#ffb26c">Fixed gate order</text>
  <line x1="202" y1="124.0" x2="209" y2="124.0" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 208 120.0 L 213 124.0 L 208 128.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="218.5" y="48.5" width="182" height="152" rx="9" fill="#232834" stroke="#35445c" stroke-opacity="1"/>
  <circle cx="240" cy="71" r="10" fill="#30263b"/>
  <text x="240" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#cca3f0">2</text>
  <text x="256" y="75" font-size="12.5" font-weight="700" fill="#edf2fa">Fold into tableau</text>
  <text x="232" y="106" font-size="11" fill="#9fb0c8">Absorb Cliffords and</text><text x="232" y="122" font-size="11" fill="#9fb0c8">pure-Clifford tails; express</text><text x="232" y="138" font-size="11" fill="#9fb0c8">rotations, noise, &amp; outputs</text><text x="232" y="154" font-size="11" fill="#9fb0c8">over the |0…0⟩ frame.</text>
  <rect x="230" y="170" width="158" height="20" rx="5" fill="#30263b"/>
  <text x="309.0" y="183.5" text-anchor="middle" font-size="10.2" font-weight="600" fill="#cca3f0">Tableau analog of ZX</text>
  <line x1="404" y1="124.0" x2="411" y2="124.0" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 410 120.0 L 415 124.0 L 410 128.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="420.5" y="48.5" width="182" height="152" rx="9" fill="#232834" stroke="#35445c" stroke-opacity="1"/>
  <circle cx="442" cy="71" r="10" fill="#1d3530"/>
  <text x="442" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#70d9bf">3</text>
  <text x="458" y="75" font-size="12.5" font-weight="700" fill="#edf2fa">Drop unseen work</text>
  <text x="434" y="106" font-size="11" fill="#9fb0c8">Prune dead faults, fixed</text><text x="434" y="122" font-size="11" fill="#9fb0c8">|0⟩ axes, and commuting</text><text x="434" y="138" font-size="11" fill="#9fb0c8">checks; merge noise with</text><text x="434" y="154" font-size="11" fill="#9fb0c8">identical output effects.</text>
  <rect x="432" y="170" width="158" height="20" rx="5" fill="#1d3530"/>
  <text x="511.0" y="183.5" text-anchor="middle" font-size="10.2" font-weight="600" fill="#70d9bf">Exact distribution kept</text>
  <line x1="606" y1="124.0" x2="613" y2="124.0" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 612 120.0 L 617 124.0 L 612 128.0" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="622.5" y="48.5" width="182" height="152" rx="9" fill="#232834" stroke="#8fb4ff" stroke-opacity="0.55"/>
  <circle cx="644" cy="71" r="10" fill="#26334a"/>
  <text x="644" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#8fb4ff">4</text>
  <text x="660" y="75" font-size="12.5" font-weight="700" fill="#edf2fa">Reschedule &amp; lower</text>
  <text x="636" y="106" font-size="11" fill="#9fb0c8">Order surviving quantum</text><text x="636" y="122" font-size="11" fill="#9fb0c8">ops measurement-first to</text><text x="636" y="138" font-size="11" fill="#9fb0c8">minimize peak active width,</text><text x="636" y="154" font-size="11" fill="#9fb0c8">then emit standard HIR.</text>
  <rect x="634" y="170" width="158" height="20" rx="5" fill="#26334a"/>
  <text x="713.0" y="183.5" text-anchor="middle" font-size="10.2" font-weight="600" fill="#8fb4ff">Narrower sampling plan</text>
</svg>
