name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CLIFFT_LINUX_WHEEL_CLANG_VERSION: "22.1.8.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  wasm:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Wasm module
        uses: ./.github/actions/build-wasm

      - name: Run Wasm smoke tests
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            emscripten/emsdk:3.1.74 \
            node --experimental-vm-modules src/wasm/test_wasm.mjs

  lint:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check uv lockfile
        run: uv lock --check

      - name: Check runtime ISA without dispatch
        run: |
          c++ -std=c++20 -Isrc \
            src/clifft/util/runtime_isa.cc \
            tools/ci/check_runtime_isa_no_dispatch.cc \
            -o /tmp/clifft-runtime-isa-no-dispatch
          /tmp/clifft-runtime-isa-no-dispatch

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Run pre-commit
        run: uv run --frozen --only-group dev pre-commit run --all-files --show-diff-on-failure

  playground-lint:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install dependencies
        run: cd playground && npm ci

      - name: TypeScript type check
        run: cd playground && npx tsc -b

      - name: ESLint
        run: cd playground && npm run lint

  hip-offline-build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:7.2.4
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y cmake git ninja-build

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python binding build dependencies
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Configure gfx942 HIP build
        run: |
          cmake -S . -B build-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIFFT_ENABLE_HIP=ON \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm

      - name: Compile HIP backend and conformance tests
        run: cmake --build build-hip --target clifft_hip_tests --parallel 2

      - name: Run GPU-free HIP conformance tests
        run: ctest --test-dir build-hip --output-on-failure --no-tests=error -R HIP
      - name: Build editable HIP Python package
        env:
          CMAKE_ARGS: >-
            -DCMAKE_BUILD_TYPE=Release
            -DCLIFFT_ENABLE_HIP=ON
            -DCMAKE_HIP_ARCHITECTURES=gfx942
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++
            -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: uv pip install --editable .

      - name: Run GPU-free HIP Python boundary tests
        run: uv run --no-sync pytest tests/python/test_experimental_hip.py -v

  build-and-test:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_TYPE: Debug
      SKBUILD_CMAKE_BUILD_TYPE: Debug
      CLIFFT_CPU_BASELINE: x86-64-v2
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # Runner images are rebuilt with fresh file mtimes even when the
      # compiler is unchanged, so the default mtime-based compiler check
      # misses across image rollouts; hash the compiler binary instead.
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ninja and ccache
        uses: ./.github/actions/setup-native-tools

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ env.CMAKE_BUILD_TYPE }}-${{ env.CLIFFT_CPU_BASELINE }}
          # Caches saved from PR runs are scoped to the PR ref and cannot be
          # reused elsewhere; saving only on main limits repo cache eviction.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Configure C++ build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCLIFFT_CPU_BASELINE=${{ env.CLIFFT_CPU_BASELINE }}

      - name: Build C++
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Audit build flags
        run: |
          python3 tools/ci/audit_build_flags.py \
            --compile-commands build/compile_commands.json

      - name: Check x86 kernel CPU flags
        id: isa_check
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          flags = set()
          for line in Path("/proc/cpuinfo").read_text().splitlines():
              if line.startswith("flags"):
                  flags = set(line.split(":", 1)[1].split())
                  break

          avx2_required = [{"avx2"}, {"bmi2"}, {"fma"}]
          # The AVX-512 kernel TU is compiled with -mavx512f -mavx512dq on
          # top of the AVX2 flags, so it needs the AVX2 set plus both.
          avx512_required = avx2_required + [{"avx512f"}, {"avx512dq"}]

          def check(isa: str, required: list[set[str]]) -> bool:
              missing = ["|".join(sorted(g)) for g in required if not (g & flags)]
              if missing:
                  print(f"::notice::Skipping forced {isa} tests; missing CPU flags: {' '.join(missing)}")
              return not missing

          avx2_supported = check("AVX2", avx2_required)
          avx512_supported = check("AVX-512", avx512_required)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"avx2_supported={str(avx2_supported).lower()}\n")
              fh.write(f"avx512_supported={str(avx512_supported).lower()}\n")
          PY

      - name: Run C++ tests (default ISA)
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      - name: Run C++ tests (scalar ISA)
        env:
          CLIFFT_FORCE_ISA: scalar
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      - name: Run C++ tests (avx2 ISA)
        if: steps.isa_check.outputs.avx2_supported == 'true'
        env:
          CLIFFT_FORCE_ISA: avx2
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      # Supplemental host-dependent coverage: runner CPU models vary, so
      # this leg only runs when the runner happens to support AVX-512.
      # The deterministic AVX-512 check is the SDE smoke in
      # release-cpp-smoke, which executes on a fixed emulated CPU model.
      - name: Run C++ tests (avx512 ISA)
        if: steps.isa_check.outputs.avx512_supported == 'true'
        env:
          CLIFFT_FORCE_ISA: avx512
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      - name: Install Python package
        run: uv sync --locked

      - name: Audit Python extension exports
        run: uv run python tools/ci/audit_python_exports.py

      - name: Run Python tests (default ISA)
        run: uv run --locked pytest tests/python/ -n logical --maxprocesses 4 -v

      - name: Run Python tests (scalar ISA)
        env:
          CLIFFT_FORCE_ISA: scalar
        run: uv run --locked pytest tests/python/ -n logical --maxprocesses 4 -v

      - name: Test documentation code examples
        run: uv run --locked pytest --codeblocks docs/ README.md -v

  release-cpp-smoke:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      CMAKE_BUILD_TYPE: Release
      CLIFFT_CPU_BASELINE: x86-64-v2
      CLIFFT_INTERPROCEDURAL_OPTIMIZATION: "ON"
      CLIFFT_OPENMP: "ON"
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      # Catch2 3.5 uses __COUNTER__, which Clang 22 diagnoses under -Wpedantic.
      CXXFLAGS: -Wno-c2y-extensions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Direct, checksum-verified downloads avoid apt metadata and dependency
      # fetches. QEMU is intentionally pinned to Noble's stable GA package;
      # this smoke needs reproducible CPU emulation rather than distro updates.
      - name: Install pinned build and emulation tools
        uses: ./.github/actions/setup-native-tools
        with:
          install-qemu: "true"

      - name: Install pinned Clang and OpenMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-18-dev
          .github/scripts/install_ubuntu_clang.sh \
            "${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}" \
            "$RUNNER_TEMP/clifft-clang"

      - name: Install Intel SDE
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            --output /tmp/sde.tar.xz \
            https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  /tmp/sde.tar.xz" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xf /tmp/sde.tar.xz
          echo "SDE64=$RUNNER_TEMP/sde-external-10.13.1-2026-07-28-lin/sde64" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-clang-${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}-${{ env.CMAKE_BUILD_TYPE }}-${{ env.CLIFFT_CPU_BASELINE }}
          # Caches saved from PR runs are scoped to the PR ref and cannot be
          # reused elsewhere; saving only on main limits repo cache eviction.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      - name: Configure C++ build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ env.CLIFFT_INTERPROCEDURAL_OPTIMIZATION }} \
            -DCLIFFT_OPENMP=${{ env.CLIFFT_OPENMP }} \
            -DCLIFFT_CPU_BASELINE=${{ env.CLIFFT_CPU_BASELINE }}

      - name: Build C++ tests
        run: cmake --build build --target clifft_tests --parallel

      - name: Audit release-like build flags
        run: |
          python3 tools/ci/audit_build_flags.py \
            --compile-commands build/compile_commands.json
          rg --quiet -- '-flto=thin' build/compile_commands.json
          rg --quiet -- '-fuse-ld=lld' build/build.ninja

      - name: Run C++ smoke tests
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # assert() stays active in the optimized extension so the full
      # Python suite checks invariants through the shipping Clang, ThinLTO,
      # and -ffast-math codegen. ISA dispatch does not depend on NDEBUG, so the
      # emulated smokes below reuse this wheel; repaired artifacts are checked
      # separately by linux-release-wheel-smoke and the release workflow.
      - name: Install Python package (release baseline, asserts on)
        env:
          SKBUILD_CMAKE_BUILD_TYPE: Release
          SKBUILD_CMAKE_ARGS: "-DCLIFFT_FORCE_ASSERTS=ON"
        run: |
          uv venv .smoke-venv
          . .smoke-venv/bin/activate
          uv sync --locked --active

      - name: Audit Python extension exports
        run: .smoke-venv/bin/python tools/ci/audit_python_exports.py

      - name: Run Python tests (optimized extension)
        run: .smoke-venv/bin/python -m pytest tests/python/ -n logical --maxprocesses 4 -v

      # Run a small QEMU-emulated CPU matrix against the release-baseline
      # Python install. Catches AVX-512 leakage into the AVX-2 dispatch
      # path (would SIGILL the emulated CPU) and validates that
      # CLIFFT_FORCE_ISA traps fire cleanly on incompatible hosts. QEMU's
      # TCG engine cannot execute AVX-512 instructions, so the SDE legs
      # below are what execute the AVX-512 backend deterministically.
      - name: QEMU smoke -- Haswell (auto-detect)
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell auto pass avx2
      - name: QEMU smoke -- Haswell + FORCE_ISA=avx2
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell avx2 pass avx2
      - name: QEMU smoke -- Haswell + FORCE_ISA=avx512 (clean trap)
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell avx512 fail
      - name: QEMU smoke -- Nehalem (auto-detect)
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Nehalem auto pass scalar
      - name: QEMU smoke -- Nehalem + FORCE_ISA=avx2 (clean trap)
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Nehalem avx2 fail
      - name: SDE smoke -- Skylake-X (auto-detect)
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh sde skx auto pass avx512
      - name: SDE smoke -- Skylake-X + FORCE_ISA=avx512
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh sde skx avx512 pass avx512 intra-shot

  # Build and test the repaired manylinux artifacts on every pull request.
  # This uses the same compiler, ThinLTO, linker, OpenMP, and CPU baselines as
  # the release workflow while the GCC jobs retain source-build coverage.
  linux-release-wheel-smoke:
    name: Linux release wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            cpu_baseline: x86-64-v2
          - os: ubuntu-24.04-arm
            arch: aarch64
            cpu_baseline: generic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and test repaired wheel
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: "cp312-manylinux_*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_LINUX: >-
            CC=/opt/clang/bin/clang
            CXX=/opt/clang/bin/clang++
            CPATH=/opt/clifft-openmp/include
            LDFLAGS=-fuse-ld=lld
            CLIFFT_CPU_BASELINE=${{ matrix.cpu_baseline }}
            CLIFFT_INTERPROCEDURAL_OPTIMIZATION=ON
            CLIFFT_OPENMP=ON
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0
          CIBW_BEFORE_ALL_LINUX: >-
            bash {package}/.github/scripts/install_manylinux_clang.sh
            ${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}
          CIBW_BEFORE_BUILD: pip install setuptools-scm
          CIBW_TEST_COMMAND_LINUX: >-
            python {project}/.github/scripts/artifact_smoke.py --exercise-intra-shot
            &&
            python {project}/tools/ci/audit_python_exports.py

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: pr-linux-wheel-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # Round-trips the packaging pipeline on every pull request: the sdist
  # must be complete and buildable, it must produce a cp312-abi3 wheel,
  # and that wheel must install and run on the newest stable CPython,
  # which is newer than the 3.12 interpreter the wheel targets. The
  # release workflow separately smokes the exact published artifact.
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLIFFT_CPU_BASELINE: x86-64-v2
      SKBUILD_CMAKE_BUILD_TYPE: Release
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for setuptools-scm

      - name: Install ninja and ccache
        uses: ./.github/actions/setup-native-tools

      # Distinct key from release-cpp-smoke: both jobs save timestamped
      # entries and restores take the newest prefix match, so a shared
      # prefix lets each job clobber the other's warm objects.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-package-Release-${{ env.CLIFFT_CPU_BASELINE }}
          # Caches saved from PR runs are scoped to the PR ref and cannot be
          # reused elsewhere; saving only on main limits repo cache eviction.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist
        run: uv build --sdist

      # Build from the sdist, not the checkout, so a file missing from
      # the sdist manifest fails here instead of only at publish time.
      - name: Build wheel from sdist
        run: uv build --wheel --out-dir wheelhouse dist/*.tar.gz

      # Catches a silent regression of the wheel.py-api pin.
      - name: Assert the wheel is stable-ABI (cp312-abi3)
        run: ls wheelhouse/clifft-*cp312-abi3*.whl

      - name: Install the wheel on the newest stable CPython
        run: |
          uv venv --python 3.14 .abi3-venv
          uv pip install --python .abi3-venv/bin/python wheelhouse/*.whl

      - name: Run the packaging smoke
        run: .abi3-venv/bin/python .github/scripts/artifact_smoke.py --expect-python 3.14

      # The suite adds interpreter-behavior coverage for the wrapper; PRs
      # get the focused smoke above. Test dependencies install at their
      # locked versions so an unrelated PyPI release cannot fail this
      # main-only step; the wheel stays the artifact under test.
      - name: Run Python tests against the installed wheel (main only)
        if: github.event_name == 'push'
        run: |
          uv export --frozen --only-group dev --no-emit-project \
            --output-file /tmp/dev-requirements.txt
          uv pip install --python .abi3-venv/bin/python \
            --requirements /tmp/dev-requirements.txt
          .abi3-venv/bin/python -m pytest tests/python/ -n logical --maxprocesses 4 -v

  cross-platform:
    name: cross-platform (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Covers GCC and Linux platform behavior on the architecture of
          # the published aarch64 wheel; no other pull-request job runs on
          # arm64.
          - label: Linux arm64
            os: ubuntu-24.04-arm
            install-deps: sudo apt-get update && sudo apt-get install -y ninja-build
            skbuild-type: Debug
            skbuild-cmake-args: ""
          - label: macOS
            os: macos-latest
            install-deps: brew install ninja libomp
            skbuild-type: Debug
            skbuild-cmake-args: ""
          # MSVC Debug wheels make the Python suite several times slower than
          # every other platform, so Windows tests an optimized wheel that
          # keeps assert() active instead.
          - label: Windows
            os: windows-latest
            install-deps: ""
            skbuild-type: RelWithDebInfo
            skbuild-cmake-args: "-DCLIFFT_FORCE_ASSERTS=ON"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CMAKE_BUILD_TYPE: Debug
      SKBUILD_CMAKE_BUILD_TYPE: ${{ matrix.skbuild-type }}
      SKBUILD_CMAKE_ARGS: ${{ matrix.skbuild-cmake-args }}
      CLIFFT_CPU_BASELINE: generic
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: matrix.install-deps != ''
        run: ${{ matrix.install-deps }}

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ env.CMAKE_BUILD_TYPE }}-${{ env.CLIFFT_CPU_BASELINE }}
          # Caches saved from PR runs are scoped to the PR ref and cannot be
          # reused elsewhere; saving only on main limits repo cache eviction.
          save: ${{ github.ref == 'refs/heads/main' }}
          evict-old-files: job

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure C++ build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DCLIFFT_CPU_BASELINE=${{ env.CLIFFT_CPU_BASELINE }}

      - name: Build C++
        run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }} --parallel

      - name: Show ccache verbose stats
        if: runner.os == 'Windows'
        run: ccache -sv

      - name: Run C++ tests (skip benchmarks on cross-platform)
        run: |
          ctest --test-dir build \
            --build-config ${{ env.CMAKE_BUILD_TYPE }} \
            --output-on-failure \
            --parallel \
            --timeout 300 \
            -E "Bench"
        shell: bash

      - name: Install Python package
        run: uv sync --locked

      - name: Audit Python extension exports
        run: uv run python tools/ci/audit_python_exports.py

      - name: Run Python tests
        run: uv run --locked pytest tests/python/ -n logical --maxprocesses 4 -v

  # Single aggregate check for branch protection. Requiring this job
  # instead of enumerating every job means new or renamed jobs cannot
  # silently drop out of enforcement, and it reports success only when
  # every needed job succeeded.
  ci-gate:
    timeout-minutes: 10
    if: always()
    needs:
      - wasm
      - lint
      - playground-lint
      - hip-offline-build
      - build-and-test
