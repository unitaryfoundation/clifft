name: Phase canary diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CLIFFT_FORCE_ISA: avx2
      OMP_DYNAMIC: "FALSE"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-native-tools
      - name: Install compiler and profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-18-dev linux-tools-generic
          .github/scripts/install_ubuntu_clang.sh 22.1.8.1 "$RUNNER_TEMP/clifft-clang"
          sudo sysctl kernel.perf_event_paranoid=-1
      - name: Capture paired timings and profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/phase_canary_tiled.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phase-canary-diagnostics
          path: diagnostic-results/
          retention-days: 7
