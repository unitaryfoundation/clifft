name: Issue 554 heap-layout diagnosis

# Temporary diagnostic branch only. Never merge.
on:
  push:
    branches: [diag/issue-554-heap-layout]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: diagnose slot ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch saved canary binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37790615669 -R "$GITHUB_REPOSITORY" -n canary-diagnosis -D saved
          chmod +x saved/base saved/head
          grep -m1 'Model name' saved/cpu.txt

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-18-dev

      - name: Build tracer
        run: gcc -O2 -fPIC -shared -o tools/diag554/libmtrace.so tools/diag554/mtrace.c -lgcc_s

      - name: Run experiments
        run: bash tools/diag554/run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-554-slot-${{ matrix.slot }}
          path: diag-out/
          retention-days: 14
