name: Issue 554 heap-layout diagnosis

# Temporary diagnostic branch only. Never merge.
on:
  push:
    branches: [diag/issue-554-heap-layout]

permissions:
  contents: read
  actions: read

env:
  CLIFFT_LINUX_WHEEL_CLANG_VERSION: "22.1.8.1"
  SOURCE_SHA: 2c418257e5b6abe1690f4eaa9612d3a17f27eee2

jobs:
  diagnose:
    name: diagnose slot ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch round-4 variant binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37815619781 -R "$GITHUB_REPOSITORY" -n diag-554-variant-binaries -D canary-bin

      - name: Install runtime libraries
        run: |
          chmod +x canary-bin/*
          sudo apt-get update
          sudo apt-get install -y libomp-18-dev gdb

      - name: Build steering shim
        run: gcc -O2 -fPIC -shared -fno-asynchronous-unwind-tables -Wl,--build-id=none -o tools/diag554/steer.so tools/diag554/steer.c

      - name: Run experiments
        env:
          ZEN3_EXPERIMENTS: env layouts
          OTHER_EXPERIMENTS: env layouts
        run: bash tools/diag554/run4.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-554-round6-slot-${{ matrix.slot }}
          path: diag-out/
          retention-days: 14
