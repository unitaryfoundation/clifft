name: Release

# Trigger on final and release-candidate version tags.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
  workflow_dispatch:
    # Manual dispatch always publishes to TestPyPI only.
    # PyPI publishing requires a version tag push.
    inputs:
      test_version:
        description: "Unique TestPyPI-only version (e.g. 0.10.0rc1.dev1). Do not reuse a version intended for a tag."
        required: true

permissions:
  contents: read

env:
  CLIFFT_LINUX_WHEEL_CLANG_VERSION: "22.1.8.1"

jobs:
  # -----------------------------------------------------------
  # Build sdist (source distribution)
  # -----------------------------------------------------------
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for setuptools-scm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv build --sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.test_version || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # -----------------------------------------------------------
  # Build wheels via cibuildwheel
  # -----------------------------------------------------------
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            cibw_archs: x86_64
            cpu_baseline: x86-64-v2
          - os: ubuntu-24.04-arm
            arch: aarch64
            cibw_archs: aarch64
            cpu_baseline: generic
          - os: macos-14
            arch: arm64
            cibw_archs: arm64
            cpu_baseline: generic
            cibw_environment: MACOSX_DEPLOYMENT_TARGET=14.0
          - os: windows-latest
            arch: amd64
            cibw_archs: AMD64
            cpu_baseline: generic
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for setuptools-scm

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "*-musllinux*"
          # manylinux_2_28 retains the glibc 2.28 compatibility policy while
          # providing the pinned static Clang installer used below.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT: >-
            CLIFFT_CPU_BASELINE=${{ matrix.cpu_baseline }}
            ${{ matrix.cibw_environment || '' }}
            ${{ inputs.test_version && format('SETUPTOOLS_SCM_PRETEND_VERSION={0}', inputs.test_version) || '' }}
          CIBW_ENVIRONMENT_LINUX: >-
            CC=/opt/clang/bin/clang
            CXX=/opt/clang/bin/clang++
            CPATH=/opt/clifft-openmp/include
            LDFLAGS=-fuse-ld=lld
            CLIFFT_CPU_BASELINE=${{ matrix.cpu_baseline }}
            CLIFFT_INTERPROCEDURAL_OPTIMIZATION=ON
            CLIFFT_OPENMP=ON
            ${{ inputs.test_version && format('SETUPTOOLS_SCM_PRETEND_VERSION={0}', inputs.test_version) || '' }}
          CIBW_BEFORE_ALL_LINUX: >-
            bash {package}/.github/scripts/install_manylinux_clang.sh
            ${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}
          # Install Python build dependencies inside the cibuildwheel environment.
          CIBW_BEFORE_BUILD: pip install setuptools-scm
          # Apple Clang needs Homebrew's runtime for intra-shot OpenMP kernels.
          CIBW_BEFORE_ALL_MACOS: brew install libomp
          # Smoke-test: import the built package and audit exported symbols
          CIBW_TEST_COMMAND: >-
            python -c "import clifft; print(clifft.__version__); print(clifft.CPU_BASELINE); print(type(clifft.compile('M 0')).__name__)"
            &&
            python {project}/tools/ci/audit_python_exports.py
          # Exercise the repaired wheel against its bundled OpenMP runtime on
          # both Linux architectures.
          CIBW_TEST_COMMAND_LINUX: >-
            python {project}/.github/scripts/artifact_smoke.py --exercise-intra-shot
            &&
            python {project}/tools/ci/audit_python_exports.py
          # Test the repaired wheel's bundled runtime, not the source build.
          CIBW_TEST_COMMAND_MACOS: >-
            python {project}/.github/scripts/artifact_smoke.py --exercise-intra-shot
            &&
            python {project}/tools/ci/audit_python_exports.py

      - name: Audit bundled macOS OpenMP runtime
        if: matrix.os == 'macos-14'
        run: python3 tools/ci/audit_macos_wheel.py wheelhouse/*.whl

      # QEMU and SDE smoke against the just-built Linux x86_64 wheel.
      # Catches AVX-512 leakage into the AVX-2 dispatch path (would SIGILL
      # the emulated CPU) and validates CLIFFT_FORCE_ISA traps on the
      # wheel that will actually be published. QEMU's TCG engine cannot
      # execute AVX-512 instructions, so the SDE legs are what execute the
      # AVX-512 backend deterministically. Skipped on other arches/OSes
      # since both emulators are x86_64-specific and the other matrix
      # entries use the generic baseline.
      - name: Install QEMU (Linux x86_64 wheel only)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        uses: ./.github/actions/setup-native-tools
        with:
          install-build-tools: "false"
          install-qemu: "true"

      - name: Install Intel SDE (Linux x86_64 wheel only)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            --output /tmp/sde.tar.xz \
            https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  /tmp/sde.tar.xz" | sha256sum --check
          tar -C "$RUNNER_TEMP" -xf /tmp/sde.tar.xz
          echo "SDE64=$RUNNER_TEMP/sde-external-10.13.1-2026-07-28-lin/sde64" >> "$GITHUB_ENV"

      - name: Smoke-install the built wheel
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: |
          python3 -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install -U pip
          .smoke-venv/bin/python -m pip install wheelhouse/*.whl

      - name: QEMU smoke -- Haswell (auto-detect)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell auto pass avx2
      - name: QEMU smoke -- Haswell + FORCE_ISA=avx2
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell avx2 pass avx2
      - name: QEMU smoke -- Haswell + FORCE_ISA=avx512 (clean trap)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Haswell avx512 fail
      - name: QEMU smoke -- Nehalem (auto-detect)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Nehalem auto pass scalar
      - name: QEMU smoke -- Nehalem + FORCE_ISA=avx2 (clean trap)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh qemu Nehalem avx2 fail
      - name: SDE smoke -- Skylake-X (auto-detect)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh sde skx auto pass avx512
      - name: SDE smoke -- Skylake-X + FORCE_ISA=avx512
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: PYTHON=$(pwd)/.smoke-venv/bin/python .github/scripts/wheel_smoke.sh sde skx avx512 pass avx512 intra-shot

      # The cp312-abi3 wheel is the only build per platform, so its
      # packaging contract is forward compatibility: it must install and
      # run on interpreters newer than the 3.12 it was built with. Bump
      # the version below when a newer stable CPython is supported.
      - name: Setup uv (Linux x86_64 wheel only)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        uses: astral-sh/setup-uv@v6

      - name: Verify abi3 wheel on newest stable CPython (Linux x86_64 wheel only)
        if: matrix.os == 'ubuntu-24.04' && matrix.arch == 'x86_64'
        run: |
          uv venv --python 3.14 .abi3-venv
          uv pip install --python .abi3-venv/bin/python wheelhouse/*.whl
          .abi3-venv/bin/python .github/scripts/artifact_smoke.py --expect-python 3.14

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  # -----------------------------------------------------------
  # Publish to TestPyPI (on tag push, before PyPI)
  # -----------------------------------------------------------
  publish-testpypi:
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: testpypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # -----------------------------------------------------------
  # Publish to PyPI (only on tag push, after TestPyPI)
  # -----------------------------------------------------------
  publish-pypi:
    needs: [publish-testpypi]
    # Only publish to PyPI on tag pushes — never on manual dispatch.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # -----------------------------------------------------------
  # Create GitHub Release (only on tag push, after PyPI)
  # -----------------------------------------------------------
  github-release:
    needs: [publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          extract_notes() {
            local version="$1"
            awk -v ver="$version" '
              /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") found=1; next }
              found { print }
            ' CHANGELOG.md
          }

          VERSION="${GITHUB_REF_NAME#v}"
          extract_notes "$VERSION" > RELEASE_NOTES.md

          # Release candidates normally share the final release's prepared
          # changelog section instead of duplicating it under an rc heading.
          if [[ ! -s RELEASE_NOTES.md && "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc[0-9]+$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            extract_notes "$BASE_VERSION" > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No entry found for $VERSION in CHANGELOG.md, using tag message." >&2
            echo "Release $VERSION" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME}" =~ rc[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            "${release_args[@]}"

  # -----------------------------------------------------------
  # Publish versioned documentation and playground
  # -----------------------------------------------------------
  publish-docs:
    needs: [github-release]
    # Release candidates publish packages and a GitHub prerelease, but no docs.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, 'rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Wasm module
        uses: ./.github/actions/build-wasm

      - name: Copy Wasm artifacts
        run: |
          mkdir -p playground/public
          cp build-wasm/clifft_wasm.js playground/public/
          cp build-wasm/clifft_wasm.wasm playground/public/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install playground dependencies
        run: cd playground && npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install clifft and docs deps
        run: uv sync --locked --group docs

      - name: Build versioned playground
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd playground
          VITE_BASE_PATH="/clifft/${VERSION}/playground/" VITE_BUILD_SHA="${GITHUB_SHA}" npm run build

      - name: Stage playground inside docs tree
        run: |
          rm -rf docs/playground
          cp -r playground/dist docs/playground

      - name: Deploy versioned docs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SITE_URL="https://unitaryfoundation.github.io/clifft/${VERSION}/" \
            uv run --locked --group docs mike deploy --push "${VERSION}"

      - name: Decide whether to update stable docs
        id: stable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --locked --group docs mike list --json > /tmp/mike-list.json || echo '[]' > /tmp/mike-list.json
          VERSION="${VERSION}" uv run --locked --group docs python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          current = Version(os.environ["VERSION"])
          entries = json.loads(Path("/tmp/mike-list.json").read_text())
          released = []
          for entry in entries:
              try:
                  released.append(Version(entry["version"]))
              except (InvalidVersion, KeyError):
                  continue

          highest = max(released, default=None)
          should_update = highest is None or current >= highest
          print(f"update={'true' if should_update else 'false'}")
          print(f"highest={highest or ''}")
          PY

      - name: Build stable playground
        if: steps.stable.outputs.update == 'true'
        run: |
          cd playground
          VITE_BASE_PATH=/clifft/stable/playground/ VITE_BUILD_SHA="${GITHUB_SHA}" npm run build

      - name: Stage stable playground inside docs tree
        if: steps.stable.outputs.update == 'true'
        run: |
          rm -rf docs/playground
          cp -r playground/dist docs/playground

      - name: Deploy stable docs
        if: steps.stable.outputs.update == 'true'
        run: |
          SITE_URL=https://unitaryfoundation.github.io/clifft/stable/ \
            uv run --locked --group docs mike deploy --push stable
          uv run --locked --group docs mike set-default --push stable

      - name: Build root stable playground
        if: steps.stable.outputs.update == 'true'
        run: |
          cd playground
          VITE_BASE_PATH=/clifft/playground/ VITE_BUILD_SHA="${GITHUB_SHA}" npm run build

      - name: Deploy root stable playground
        if: steps.stable.outputs.update == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/dist
          destination_dir: playground
          keep_files: true
