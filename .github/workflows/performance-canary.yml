name: Performance canary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

env:
  CLIFFT_LINUX_WHEEL_CLANG_VERSION: "22.1.8.1"

concurrency:
  group: performance-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: advisory benchmark
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CMAKE_BUILD_TYPE: Release
      CLIFFT_CPU_BASELINE: x86-64-v2
      CLIFFT_INTERPROCEDURAL_OPTIMIZATION: "ON"
      CLIFFT_OPENMP: "ON"
      CLIFFT_FORCE_ISA: avx2
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      OMP_DYNAMIC: "FALSE"
      OMP_NUM_THREADS: "1"
      BENCHMARK_REPETITIONS: "3"
      BENCHMARK_MIN_TIME: "0.5"
      BENCHMARK_WARMUP_TIME: "0.2"
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Building both revisions from this one path keeps __FILE__, fixture paths,
      # and the resulting executable layout comparable.
      - name: Checkout normalized benchmark source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: benchmark-source
          persist-credentials: false

      - name: Install native build tools
        uses: ./.github/actions/setup-native-tools

      - name: Install pinned Clang and OpenMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-18-dev
          .github/scripts/install_ubuntu_clang.sh \
            "${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}" \
            "$RUNNER_TEMP/clifft-clang"

      - name: Select benchmark CPU
        run: |
          python3 - <<'PY'
          import os

          core = min(os.sched_getaffinity(0))
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"BENCHMARK_CPU_CORE={core}\n")
          PY

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-performance-canary-clang-${{ env.CLIFFT_LINUX_WHEEL_CLANG_VERSION }}-${{ github.event.pull_request.number }}
          evict-old-files: job

      - name: Prepare fallback report
        env:
          BASE_LABEL: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/benchmark_canary.py failure \
            --output canary-results/report.md \
            --base-label "$BASE_LABEL" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Build and run paired benchmarks
        id: benchmark
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mkdir -p canary-bin canary-results

          build_benchmarks() {
            local revision="$1"
            local output="$2"
            git -C benchmark-source checkout --detach --force "$revision"
            cmake -E remove_directory benchmark-build
            cmake -S benchmarks -B benchmark-build \
              -DCLIFFT_SOURCE_DIR="$GITHUB_WORKSPACE/benchmark-source" \
              -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION="$CLIFFT_INTERPROCEDURAL_OPTIMIZATION" \
              -DCLIFFT_OPENMP="$CLIFFT_OPENMP" \
              -DCLIFFT_CPU_BASELINE="$CLIFFT_CPU_BASELINE"
            cmake --build benchmark-build --target clifft_benchmarks --parallel
            grep --quiet -- '-flto=thin' benchmark-build/compile_commands.json
            grep --quiet -- '-fuse-ld=lld' benchmark-build/build.ninja
            cmake -E copy benchmark-build/clifft_benchmarks "$output"
          }

          build_benchmarks "$BASE_SHA" canary-bin/base
          build_benchmarks "$HEAD_SHA" canary-bin/head

          run_benchmarks() {
            local revision="$1"
            local executable="$2"
            local output="$3"
            git -C benchmark-source checkout --detach --force "$revision" >/dev/null
            (
              cd benchmark-source
              taskset --cpu-list "$BENCHMARK_CPU_CORE" \
                "$GITHUB_WORKSPACE/$executable" \
                --benchmark_min_time="${BENCHMARK_MIN_TIME}s" \
                --benchmark_min_warmup_time="$BENCHMARK_WARMUP_TIME" \
                --benchmark_repetitions="$BENCHMARK_REPETITIONS" \
                --benchmark_out="$GITHUB_WORKSPACE/$output" \
                --benchmark_out_format=json
            )
          }

          run_benchmarks \
            "$BASE_SHA" canary-bin/base canary-results/base-first.json
          run_benchmarks \
            "$HEAD_SHA" canary-bin/head canary-results/head-first.json
          run_benchmarks \
            "$HEAD_SHA" canary-bin/head canary-results/head-second.json
          run_benchmarks \
            "$BASE_SHA" canary-bin/base canary-results/base-second.json

      - name: Render comparison
        id: report
        if: steps.benchmark.outcome == 'success'
        continue-on-error: true
        env:
          BASE_LABEL: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/benchmark_canary.py report \
            --output canary-results/report.md \
            --base-label "$BASE_LABEL" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --base-first canary-results/base-first.json \
            --head-first canary-results/head-first.json \
            --head-second canary-results/head-second.json \
            --base-second canary-results/base-second.json \
            --repetitions "$BENCHMARK_REPETITIONS" \
            --min-time "$BENCHMARK_MIN_TIME" \
            --warmup-time "$BENCHMARK_WARMUP_TIME" \
            --cpu-core "$BENCHMARK_CPU_CORE"

      - name: Report canary infrastructure failure
        if: >-
          steps.benchmark.outcome == 'failure' ||
          steps.report.outcome == 'failure'
        run: echo "::warning::The performance canary could not produce a comparison"

      - name: Add report to workflow summary
        if: always()
        run: cat canary-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-canary-${{ github.event.pull_request.number }}
          path: canary-results/
          retention-days: 7

  comment:
    name: update PR comment
    needs: benchmark
    if: >-
      always() &&
      needs.benchmark.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark evidence
        uses: actions/download-artifact@v4
        with:
          name: performance-canary-${{ github.event.pull_request.number }}
          path: canary-results

      - name: Create or update sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- clifft-performance-canary -->';
            const body = fs.readFileSync('canary-results/report.md', 'utf8');
            if (!body.includes(marker)) {
              core.setFailed('Benchmark report is missing its identity marker');
              return;
            }

            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
