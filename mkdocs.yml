site_name: Clifft
site_url: !ENV [SITE_URL, "https://unitaryfoundation.github.io/clifft/"]
repo_url: https://github.com/unitaryfoundation/clifft
repo_name: unitaryfoundation/clifft
copyright: Copyright &copy; 2026 <a href="https://unitary.foundation" target="_blank">Unitary Foundation</a>

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logos/clifft-mark-light.png
  favicon: assets/logos/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_javascript:
  - javascripts/katex.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: stable

hooks:
  - docs/hooks.py

plugins:
  - search
  - redirects:
      redirect_maps:
        reference/instructions.md: reference/compiler-ir.md
        getting-started/integrations.md: guide/circuit-inputs.md
        getting-started/openqasm2.md: guide/circuit-inputs.md#openqasm-2
        guide/benchmark.md: guide/cpu-execution.md#benchmark-before-overriding
  - macros:
      module_name: docs/macros
  - minify:
      minify_html: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            overloads_only: true
            extensions:
              - docs/griffe_extensions.py:NanobindStubSignatures
            filters:
              - "!^__"

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Choose a Workflow: getting-started/choosing-a-workflow.md
  - User Guide:
    - Overview: guide/index.md
    - Performance: guide/performance.md
    - Circuits:
      - Circuit Inputs: guide/circuit-inputs.md
      - Compiling Circuits: guide/compilation.md
    - Workflows:
      - Sampling and Results: guide/simulation.md
      - Importance Sampling: guide/importance-sampling.md
      - Leakage and Loss: guide/leakage-and-loss.md
      - Exact Probabilities: guide/strong-simulation.md
    - Execution:
      - CPU Execution and Tuning: guide/cpu-execution.md
    - Tutorials:
      - Surface Code: guide/surface-code.md
      - Delayed Loss: guide/delayed-loss.md
      - Magic State Cultivation with Importance Sampling: guide/importance-sampling-tutorial.md
  - Theory:
    - Overview: theory/overview.md
    - Architecture: theory/architecture.md
    - Basis-State Probabilities: theory/basis_probabilities.md
    - Noncomputational States: theory/noncomputational.md
  - Reference:
    - Supported Gates: reference/gates.md
    - Compiler IR Reference: reference/compiler-ir.md
    - Optimization Passes: reference/passes.md
    - Python API: reference/python-api.md
  - Development:
    - Contributing: development/contributing.md
    - Building from Source: development/building.md
    - Experimental:
      - HIP Backend: development/hip-backend.md
      - HIP Kernel Development: development/hip-kernel-development.md
    - Testing Strategy: development/testing.md
    - Tableau Conventions: development/tableau-conventions.md
    - Releasing: development/releasing.md
  - Development Blog:
    - "v0.10.0 (September 2026): Packed Sampling": updates/packed-sampling.md
    - "v0.9.0 (August 2026): Parallel Sampling": updates/parallel-sampling.md
    - "v0.8.0 (August 2026): Symbolic Sampling": updates/symbolic-sampling.md
