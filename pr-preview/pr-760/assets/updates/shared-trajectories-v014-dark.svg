<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-labelledby="share-title share-desc">
  <title id="share-title">Ordinary sampling versus shared trajectory execution</title>
  <desc id="share-desc">Side-by-side comparison of 8 shots. Ordinary sampling evolves 8 separate active states even when most shots follow identical trajectories. Shared trajectory execution evolves one shared state for identical shots, splits only when a fault changes a trajectory, and drops failed postselected shots early while keeping independent per-shot classical records.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Left Card -->
  <rect x="16.5" y="8.5" width="380" height="313" rx="10" fill="#232834" stroke="#35445c"/>
  <text x="34" y="35" font-size="14" font-weight="700" fill="#edf2fa">Ordinary sampling</text>
  <text x="34" y="53" font-size="11.5" fill="#9fb0c8">Every shot evolves its own active state</text>
  <line x1="144" y1="90" x2="144" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="144" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Noise</text><line x1="230" y1="90" x2="230" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="230" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Rotations</text><line x1="312" y1="90" x2="312" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="312" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Detectors</text>
  <line x1="72" y1="104" x2="352" y2="104" stroke="#8fb4ff" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="104" r="3" fill="#8fb4ff"/><circle cx="352" cy="104" r="3" fill="#8fb4ff"/><line x1="72" y1="125" x2="352" y2="125" stroke="#ff91a7" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="125" r="3" fill="#ff91a7"/><circle cx="352" cy="125" r="3" fill="#ff91a7"/><line x1="72" y1="146" x2="352" y2="146" stroke="#ff91a7" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="146" r="3" fill="#ff91a7"/><circle cx="352" cy="146" r="3" fill="#ff91a7"/><line x1="72" y1="167" x2="352" y2="167" stroke="#8fb4ff" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="167" r="3" fill="#8fb4ff"/><circle cx="352" cy="167" r="3" fill="#8fb4ff"/><line x1="72" y1="188" x2="352" y2="188" stroke="#8fb4ff" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="188" r="3" fill="#8fb4ff"/><circle cx="352" cy="188" r="3" fill="#8fb4ff"/><line x1="72" y1="209" x2="352" y2="209" stroke="#ffb26c" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="209" r="3" fill="#ffb26c"/><circle cx="352" cy="209" r="3" fill="#ffb26c"/><line x1="72" y1="230" x2="352" y2="230" stroke="#8fb4ff" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="230" r="3" fill="#8fb4ff"/><circle cx="352" cy="230" r="3" fill="#8fb4ff"/><line x1="72" y1="251" x2="352" y2="251" stroke="#8fb4ff" stroke-width="2.2" stroke-opacity="0.82" stroke-linecap="round" /><circle cx="72" cy="251" r="3" fill="#8fb4ff"/><circle cx="352" cy="251" r="3" fill="#8fb4ff"/>
  <text x="48" y="180" text-anchor="middle" font-size="11" fill="#9fb0c8" transform="rotate(-90 48 180)">8 shots</text>
  <rect x="34" y="282" width="344" height="28" rx="6" fill="#3a2c22"/>
  <text x="206.0" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffb26c">8 independent statevector evolutions</text>

  <!-- Right Card -->
  <rect x="424.5" y="8.5" width="380" height="313" rx="10" fill="#232834" stroke="#8fb4ff" stroke-opacity="0.45"/>
  <text x="442" y="35" font-size="14" font-weight="700" fill="#edf2fa">Shared trajectory execution (v0.14)</text>
  <text x="442" y="53" font-size="11.5" fill="#9fb0c8">Identical shots share one state; classical records stay per-shot</text>
  <line x1="548" y1="90" x2="548" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="548" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Noise</text><line x1="640" y1="90" x2="640" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="640" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Postselection</text><line x1="750" y1="90" x2="750" y2="262" stroke="#2f3b4f" stroke-width="1" stroke-dasharray="3 3"/><text x="750" y="84" text-anchor="middle" font-size="10.5" fill="#9fb0c8">Output</text>

  <!-- Main shared trunk (8 shots -> 7 shots -> 5 shots) -->
  <line x1="462" y1="152" x2="548" y2="152" stroke="#8fb4ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="548" y1="152" x2="640" y2="152" stroke="#8fb4ff" stroke-width="7" stroke-linecap="round"/>
  <line x1="640" y1="152" x2="768" y2="152" stroke="#8fb4ff" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Split on fault (1 shot diverges to orange branch) -->
  <path d="M 548 152 C 572 152, 574 220, 602 220 L 768 220"
        fill="none" stroke="#ffb26c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="548" cy="152" r="5.5" fill="#232834" stroke="#ffb26c" stroke-width="2.2"/>

  <!-- Early postselection prune (2 shots discarded) -->
  <path d="M 640 152 C 654 152, 656 104, 676 104"
        fill="none" stroke="#ff91a7" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/>
  <circle cx="640" cy="152" r="5.5" fill="#232834" stroke="#ff91a7" stroke-width="2.2"/>
  <text x="682" y="108" font-size="11" font-weight="700" fill="#ff91a7">× 2 pruned early</text>

  <!-- Labels on right panel -->
  <text x="462" y="138" font-size="11" font-weight="700" fill="#8fb4ff">8 shots · 1 state</text>
  <text x="606" y="212" font-size="10.5" font-weight="600" fill="#ffb26c">1 shot splits on fault</text>
  <text x="658" y="172" font-size="11" font-weight="600" fill="#8fb4ff">5 shots share trunk</text>

  <!-- Per-shot output dots -->
  <circle cx="768" cy="152" r="4.5" fill="#8fb4ff"/>
  <circle cx="768" cy="220" r="3.5" fill="#ffb26c"/>

  <!-- Footer pill -->
  <rect x="442" y="282" width="344" height="28" rx="6" fill="#26334a"/>
  <text x="614.0" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8fb4ff">2 states evolved · failed shots dropped early</text>
</svg>
